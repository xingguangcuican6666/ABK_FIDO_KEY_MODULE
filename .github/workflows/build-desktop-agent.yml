name: Build FIDO Desktop Agent

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/build-desktop-agent.yml"
  push:
    branches:
      - "**"
    paths:
      - "agent/**"
      - ".github/workflows/build-desktop-agent.yml"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: ""
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            suffix: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            suffix: ".exe"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Test
        run: go test ./...

      - name: Prepare distribution directory
        shell: bash
        run: mkdir -p dist

      - name: Build agent
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: >-
          go build -trimpath -ldflags "-s -w"
          -o "dist/abk-fido-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}"
          .

      - name: Upload agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: abk-fido-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: agent/dist/abk-fido-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
          if-no-files-found: error
